services:
  azdo-runner-1:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AZP_URL: ${AZP_URL}
      AZP_TOKEN: ${AZP_TOKEN}
      AZP_POOL: ${AZP_POOL}
      AZP_AGENT_NAME: office-runner-1
      AZP_WORK: _work
      AGENT_ALLOW_RUNASROOT: "1"
    dns:
      - 1.1.1.1
      - 8.8.8.8
