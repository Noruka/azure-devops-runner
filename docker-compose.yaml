      AZP_URL: ${AZP_URL}
      AZP_TOKEN: ${AZP_TOKEN}
      AZP_POOL: ${AZP_POOL}
      AZP_AGENT_NAME: office-runner-4
      AZP_WORK: _work
      AGENT_ALLOW_RUNASROOT: "1"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f Agent.Listener >/dev/null || exit 1"]
      interval: 30s
