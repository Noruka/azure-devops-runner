services:
  azdo-runner-3:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AZP_URL: ${AZP_URL}
      AZP_TOKEN: ${AZP_TOKEN}
      AZP_POOL: ${AZP_POOL}
      AZP_AGENT_NAME: office-runner-3
      AZP_WORK: _work
      AGENT_ALLOW_RUNASROOT: "1"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f Agent.Listener >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  azdo-runner-4:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
